<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Tennis</title>
<style>
  :root { --bg: #0e0e0e; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  #addr { position: absolute; display: none; font: bold 18px "Trebuchet MS", Verdana, sans-serif;
          padding: 4px 8px; border: 2px solid #fff; border-radius: 6px; background: #111; color: #fff; text-align: center; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="600" height="600"></canvas><input id="addr" spellcheck="false" placeholder="192.168.1.10:8000"></div></div>
<script src="game.js"></script>
<script src="net.js"></script>
<script src="render.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>
</body>
</html>
